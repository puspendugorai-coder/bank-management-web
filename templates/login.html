<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bank Portal – Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #E5DF71, #17B2E2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      text-align: center;
    }

    .card h1 {
      font-size: 22px;
      color: #240590;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .card p.subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 30px;
    }

    .flash {
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      text-align: left;
    }
    .flash.error   { background: #fdecea; color: #c0392b; border-left: 4px solid #e74c3c; }
    .flash.success { background: #eafaf1; color: #1e8449; border-left: 4px solid #27ae60; }

    label {
      display: block;
      text-align: left;
      font-weight: 600;
      font-size: 13px;
      color: #022528;
      margin-bottom: 6px;
      margin-top: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      transition: border 0.3s;
      outline: none;
    }

    input:focus { border-color: #17B2E2; }

    .btn-login {
      width: 100%;
      padding: 13px;
      margin-top: 28px;
      background: #30C407;
      color: white;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-login:hover { background: #27a806; }

    .btn-signup {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      background: #2980B9;
      color: white;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: background 0.3s;
    }

    .btn-signup:hover { background: #1f6692; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏦 Bank Portal</h1>
    <p class="subtitle">WELCOME — PLEASE LOG IN</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/">
      <label for="username">User ID</label>
      <input type="text" id="username" name="username" placeholder="Enter your user ID" required autofocus />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required />

      <button type="submit" class="btn-login">L O G I N</button>
    </form>

    <a href="/signup" class="btn-signup">S I G N &nbsp; U P</a>
  </div>
</body>
</html>
