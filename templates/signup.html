<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bank Portal – Sign Up</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #17B2E2, #E5DF71);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      text-align: center;
    }

    .card h1 { font-size: 22px; color: #DF0808; letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase; }
    .card p.subtitle { color: #888; font-size: 13px; margin-bottom: 30px; }

    .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; text-align: left; }
    .flash.error   { background: #fdecea; color: #c0392b; border-left: 4px solid #e74c3c; }
    .flash.success { background: #eafaf1; color: #1e8449; border-left: 4px solid #27ae60; }

    label {
      display: block; text-align: left; font-weight: 600;
      font-size: 13px; color: #05026E; margin-bottom: 6px;
      margin-top: 18px; text-transform: uppercase; letter-spacing: 1px;
    }

    input[type="text"], input[type="password"] {
      width: 100%; padding: 12px 16px; border: 2px solid #ddd;
      border-radius: 8px; font-size: 15px; transition: border 0.3s; outline: none;
    }
    input:focus { border-color: #17B2E2; }

    .btn-register {
      width: 100%; padding: 13px; margin-top: 28px;
      background: #30C407; color: white; font-size: 16px;
      font-weight: bold; letter-spacing: 2px; border: none;
      border-radius: 8px; cursor: pointer; transition: background 0.3s;
    }
    .btn-register:hover { background: #27a806; }

    .back-link { display: block; margin-top: 16px; color: #2980B9; font-size: 14px; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create Account</h1>
    <p class="subtitle">REGISTER TO ACCESS THE BANK PORTAL</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/signup">
      <label for="username">User ID</label>
      <input type="text" id="username" name="username" placeholder="Choose a user ID" required autofocus />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Choose a password" required />

      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required />

      <button type="submit" class="btn-register">S I G N &nbsp; U P</button>
    </form>

    <a href="/" class="back-link">← Back to Login</a>
  </div>
</body>
</html>
